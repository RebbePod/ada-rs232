# Merge this fragment into your existing ESPHome device configuration.
# Keep your existing esp32, wifi/ethernet, api encryption, logger and ota settings.
# Remove the old ADA scripts, interval, template switches, custom command text,
# send-command button and UART debug receiver before installing this fragment.
# Do not define a second api: block if you already have one.

uart:
  id: ada_uart
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256
  tx_buffer_size: 256

serial_proxy:
  - id: ada_serial_proxy
    uart_id: ada_uart
    name: ADA PTM-1645
    port_type: RS232
